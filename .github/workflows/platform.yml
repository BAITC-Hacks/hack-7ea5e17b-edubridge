name: Platform checks
on:
  push:
    branches: [feat/agent-platform]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src/wind_agent/agent src/wind_agent/weather src/wind_agent/api src/wind_agent/contracts.py src/wind_agent/config.py src/wind_agent/cli.py
      - run: python -m wind_agent --config config/demo.json replay --horizon-hours 48
