name: Platform checks
on:
  push:
    branches: [feat/agent-platform, feat/forecast-model]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,weather,model]' -r ui/requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check src/wind_agent tests/model tests/weather tests/agent scripts/validate_model_package.py scripts/run_app.py scripts/verify_app_integration.py scripts/verify_february_replay.py
      - run: python -m wind_agent --config config/demo.json replay --horizon-hours 48
