[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-agent"
version = "0.1.0"
description = "Auditable historical wind-power forecast orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "httpx==0.28.1",
  "pandas==2.2.3",
  "uvicorn==0.34.2",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.9"]
weather = ["eccodes==2.44.0"]
model = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
]

[project.scripts]
wind-agent = "wind_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
